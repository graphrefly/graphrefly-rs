# cargo-nextest configuration for graphrefly-rs.
#
# Why nextest: `cargo test` runs each integration-test binary one-at-a-time,
# only parallelising the `#[test]` fns *within* a binary. nextest builds every
# binary, then runs ALL tests across ALL binaries in a single global thread
# pool — true cross-binary parallelism.
#
# The `slow-timeout` here is deliberate: a deadlocked cross-thread test
# (e.g. the §7 serialization-group concurrency tests) previously hung a
# `cargo test` run for ~1h45m, holding the cargo build-directory lock and
# blocking every other session behind it. nextest now kills any test that
# overruns instead of hanging the whole suite (and the machine).

[profile.default]
# Run as many tests concurrently as logical CPUs. Override per-run with
# `--test-threads N` or `NEXTEST_TEST_THREADS`.
test-threads = "num-cpus"

# Quarantine the `cascade_depth` stress tests out of the inner dev loop.
# They are NOT benchmarks — they are stack-safety regression guards (deep
# 5000-node chain must not overflow the OS thread stack; iterative-walk
# invariant for terminate/teardown/invalidate cascades). But that
# guarantee is binary and only needs re-checking when cascade code
# changes / before merge, not on every `cargo nextest run`. They are ~95%
# of suite wall time (4 tests × ~13.6s vs 304 tests ≤0.11s each), so
# excluding them takes the default loop from ~14s → ~1s.
#
# Run them explicitly with the full suite via:  cargo tc          (ci profile)
#                                       or:  cargo nextest run --profile stress
default-filter = "not binary(cascade_depth)"

# A correct unit/integration test in this suite finishes in well under a
# second. If one runs 60s it is almost certainly deadlocked or busy-waiting
# (spec §5: no polling / no busy-wait). Warn at 60s, then KILL after 3
# overruns (3 min) so a hang can never wedge the suite again.
slow-timeout = { period = "60s", terminate-after = 3 }

# Local dev: stop on first failure for a fast feedback loop.
fail-fast = true
retries = 0

# Surface the slowest tests so regressions in test runtime are visible.
status-level = "pass"
final-status-level = "slow"

[profile.ci]
# CI runs EVERYTHING, including the quarantined cascade_depth stress
# tests — the stack-safety invariant must be gated before merge.
default-filter = "all()"
# CI wants the full failure picture, not first-failure.
fail-fast = false
retries = { backoff = "fixed", count = 2, delay = "1s" }
slow-timeout = { period = "60s", terminate-after = 4 }
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"

[profile.stress]
# On-demand full run from the dev box (e.g. after touching cascade /
# terminate / teardown / invalidate code). Same as default but WITHOUT
# the cascade_depth quarantine, so the stack-safety guards execute.
default-filter = "all()"
slow-timeout = { period = "60s", terminate-after = 3 }
fail-fast = true
