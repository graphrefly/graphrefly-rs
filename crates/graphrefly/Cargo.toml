[package]
name        = "graphrefly-rs"
version     = "0.0.1"          # first clean-slate crates.io release
description  = "GraphReFly — reactive universal reduction layer (Rust clean-slate substrate)"
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
homepage     = { workspace = true }
authors      = { workspace = true }

[lib]
name = "graphrefly"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default          = []
tokio            = ["dep:tokio"]
tokio-http       = ["tokio", "dep:reqwest"]
tokio-http-stream = ["tokio-http"]
tokio-websocket  = ["tokio", "dep:futures-util", "dep:tokio-tungstenite"]
tokio-worker     = ["tokio"]

[dependencies]
futures-core = { version = "0.3", default-features = false }
futures-util = { version = "0.3.32", optional = true, default-features = false, features = ["std", "sink"] }
notify       = { version = "8.2" }
reqwest      = { version = "0.13.4", optional = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
sha2         = { workspace = true }
tokio        = { workspace = true, optional = true, features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", optional = true, default-features = false, features = ["connect", "rustls-tls-native-roots"] }

# Substrate is sync-core (F-SYNC-CORE) + single-thread (D22): deliberately
# dependency-light. Uncomment per-module as CSP-5 fills the skeleton.
# thiserror.workspace         = true
# tracing.workspace           = true
# smallvec.workspace          = true
# indexmap.workspace          = true
# static_assertions.workspace = true   # !Send/!Sync lock once Node<T> lands (D22)

[dev-dependencies]
# proptest.workspace = true     # cross-impl property tests (D14 / F-PROTO-SPEC)
