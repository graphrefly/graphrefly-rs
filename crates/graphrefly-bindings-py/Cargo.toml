[package]
name        = "graphrefly-bindings-py"
description = "GraphReFly clean-slate native Python binding foundation via PyO3"
publish     = false
version = "0.0.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[lib]
name       = "_native"   # private extension loaded as `graphrefly._native`
crate-type = ["cdylib", "rlib"]
test       = false

[dependencies]
graphrefly_rs = { package = "graphrefly-rs", path = "../graphrefly" }
serde_json = { workspace = true }

# `extension-module` is an explicit wheel/maturin feature because enabling it
# while linking Rust test binaries leaves Python symbols unresolved on macOS.
# `test-python` opts Rust tests into embedding CPython for local smoke coverage.
pyo3 = { version = "0.25", features = ["abi3-py312"] }

[features]
default = []
extension-module = ["pyo3/extension-module"]
test-python = ["pyo3/auto-initialize"]

# Note: `[profile.release]` lives at the workspace root.
