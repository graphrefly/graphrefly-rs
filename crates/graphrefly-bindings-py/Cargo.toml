[package]
name        = "graphrefly-bindings-py"
description = "GraphReFly Python bindings via PyO3"
publish     = false   # Built into graphrefly-py via maturin; not a crates.io artifact (PART 14, session-doc D-bindings).
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[lib]
name       = "graphrefly"   # `import graphrefly` on the Python side
crate-type = ["cdylib"]

[dependencies]
graphrefly-core       = { workspace = true, optional = true }
graphrefly-graph      = { workspace = true, optional = true }
graphrefly-operators  = { workspace = true, optional = true }
graphrefly-storage    = { workspace = true, optional = true }
graphrefly-structures = { workspace = true, optional = true }

# pyo3 — `extension-module` produces a .so/.pyd; `abi3-py39` targets the
# stable Python ABI from 3.9 onward (one wheel per platform, not per
# Python minor version).
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }

[features]
default  = ["tracing"]

tracing  = ["dep:graphrefly-core"]
standard = ["tracing", "graph-codec", "operators"]
full     = ["standard", "storage", "structures"]

graph-codec = ["dep:graphrefly-graph"]
operators   = ["dep:graphrefly-operators"]
storage     = ["dep:graphrefly-storage"]
structures  = ["dep:graphrefly-structures"]

# Note: `[profile.release]` lives at the workspace root.
