name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight CI run if a newer commit lands on the same ref.
# This dedupes user-push storms (rapid commits to a PR or main).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # `RUSTFLAGS: -D warnings` is applied per-step in the `rust` job below.

# Skip CI on PR sync events from the release-plz bot. Rationale:
#   - User pushes commit to main → CI runs on push (verifies the change).
#   - release-plz auto-updates its release PR with version bumps + changelog
#     entries on top of that commit → would re-trigger CI on pull_request
#     synchronize, but the only diff vs the just-tested main is mechanical
#     (Cargo.toml version, CHANGELOG.md additions) — testing it is redundant.
#   - After PR merge, the push of "chore: release vX.Y.Z" to main DOES run CI.
#     release.yml publishes only after the CI workflow_run succeeds for that
#     commit.
#
# Applied as a per-job `if:` because GitHub Actions doesn't support workflow-
# level conditional triggering by author. The expression below excludes ONLY
# bot-authored PR-sync events; everything else (user push, user PR, etc.)
# runs normally.

jobs:
  # ---------------------------------------------------------------------
  # Rust: check + test + clippy + fmt + cargo-deny on the pinned 1.95
  # toolchain (workspace `rust-toolchain.toml`).
  # ---------------------------------------------------------------------
  rust:
    name: Rust ${{ matrix.toolchain }}
    if: "${{ github.event_name != 'pull_request' || github.actor != 'graphrefly-write-content[bot]' }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.95"]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-${{ matrix.toolchain }}

      - name: Cargo fmt --check
        run: cargo fmt --all -- --check

      - name: Cargo check (workspace)
        run: cargo check --workspace
        env:
          RUSTFLAGS: "-D warnings"

      - name: Cargo clippy (graphrefly-rs, all targets, pedantic-tier)
        run: cargo clippy -p graphrefly-rs --all-targets -- -D warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Checkout graphrefly authority fixtures
        uses: actions/checkout@v5
        with:
          repository: graphrefly/graphrefly
          ref: main
          path: graphrefly-authority

      # nextest `ci` profile: `default-filter = "all()"` so the
      # cascade_depth stack-safety stress tests (quarantined out of the
      # local default loop in .config/nextest.toml) DO run here — the
      # no-stack-overflow invariant is merge-gated. The profile's
      # slow-timeout also kills a deadlocked test after 4×60s instead of
      # burning the whole job's wall-clock budget.
      - name: Cargo nextest (graphrefly-rs, ci profile — incl. cascade_depth)
        run: cargo nextest run -p graphrefly-rs --profile ci --all-targets
        env:
          GRAPHREFLY_SPEC_ROOT: ${{ github.workspace }}/graphrefly-authority/spec
          RUSTFLAGS: "-D warnings"

      - name: Rustdoc mechanical generator check
        run: scripts/generate-rustdoc-comments.py --check-stale

      - name: Cargo doc (graphrefly-rs all features; missing docs + links)
        run: cargo doc -p graphrefly-rs --all-features --no-deps
        env:
          # `-D warnings` keeps rustdoc warnings fatal; the crate also has
          # `#![deny(missing_docs)]`, so every public Rust API must carry docs.
          RUSTDOCFLAGS: "-D warnings"

  # ---------------------------------------------------------------------
  # Supply-chain audit via cargo-deny — license allowlist, advisory
  # database, version-unification warnings. Pinned action version so
  # `cargo install cargo-deny` doesn't recompile from source on every
  # CI run.
  # ---------------------------------------------------------------------
  deny:
    name: cargo deny (supply-chain audit)
    if: "${{ github.event_name != 'pull_request' || github.actor != 'graphrefly-write-content[bot]' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  # ---------------------------------------------------------------------
  # Python binding foundation: keep the retained binding crate compiling
  # after the JS/WASM/native binding crates were retired.
  # ---------------------------------------------------------------------
  bindings-py:
    name: Python binding smoke
    if: "${{ github.event_name != 'pull_request' || github.actor != 'graphrefly-write-content[bot]' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          components: clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: bindings-py

      - name: Cargo check (Python binding test feature)
        run: cargo check -p graphrefly-bindings-py --features test-python
        env:
          RUSTFLAGS: "-D warnings"

  # ---------------------------------------------------------------------
  # TLA+ model checks — runs selected canonical models from
  # `graphrefly/formal`, the language-neutral authority repo.
  #
  # CI fetches the models via raw GitHub URLs so this workflow doesn't need a
  # sibling-repo checkout. When the formal models change, this CI picks them up
  # on the next run.
  # ---------------------------------------------------------------------
  tlc:
    name: TLA+ model check (wave_protocol scenarios)
    if: "${{ github.event_name != 'pull_request' || github.actor != 'graphrefly-write-content[bot]' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java (TLC requires JRE 11+)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download TLA+ tools
        run: |
          curl -fL --retry 3 -o /tmp/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          test -s /tmp/tla2tools.jar

      - name: Fetch formal models from graphrefly/formal
        # NOTE: pinned via the `TLA_REF` env var. `main` is the Rust port's
        # default tracking branch — it picks up canonical-spec amendments
        # immediately. Pin to a release SHA / tag once the authority repo cuts
        # versioned releases.
        env:
          TLA_REF: main
        shell: bash -euo pipefail {0}
        run: |
          mkdir -p /tmp/tla
          BASE_SPEC="https://raw.githubusercontent.com/graphrefly/graphrefly/${TLA_REF}/formal"
          fetch() {
            # `--retry-all-errors` retries on 404 too — covers the case where
            # raw.githubusercontent.com's CDN edge hasn't propagated a fresh
            # push yet. Without it, `--retry` skips 404. `--retry-delay 10`
            # spaces retries to let CDN catch up.
            local url="$1" out="$2"
            curl -fL --retry 5 --retry-all-errors --retry-delay 10 \
              -o "$out" "$url"
            test -s "$out"
          }
          for f in wave_protocol.tla wave_protocol_MC.tla wave_protocol.cfg \
                   wave_rewire.tla wave_rewire.cfg; do
            fetch "$BASE_SPEC/$f" "/tmp/tla/$f"
          done

      - name: TLC — wave_protocol_MC
        working-directory: /tmp/tla
        # `set -euo pipefail` ensures a failed `java` invocation (OOM,
        # classpath error, etc.) propagates through `tee` instead of being
        # masked by `tee`'s exit code. The explicit `grep` checks cover
        # TLC's logical failures (invariant violations, "Error:" lines).
        shell: bash -euo pipefail {0}
        run: |
          java -XX:+UseParallelGC -jar /tmp/tla2tools.jar \
            -tool -workers auto -config wave_protocol.cfg wave_protocol_MC.tla \
            | tee wave_protocol.log
          # TLC reports "Model checking completed" on success; "Error:" or
          # "Invariant ... is violated" on failure.
          grep -q "Model checking completed" wave_protocol.log
          ! grep -q "is violated" wave_protocol.log
          ! grep -qi "^error:" wave_protocol.log

      - name: TLC — wave_rewire
        working-directory: /tmp/tla
        shell: bash -euo pipefail {0}
        run: |
          java -XX:+UseParallelGC -jar /tmp/tla2tools.jar \
            -tool -workers auto -config wave_rewire.cfg wave_rewire.tla \
            | tee rewire.log
          grep -q "Model checking completed" rewire.log
          ! grep -q "is violated" rewire.log
          ! grep -qi "^error:" rewire.log
