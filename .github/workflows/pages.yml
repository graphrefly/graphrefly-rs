name: Deploy docs to GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "crates/graphrefly/src/**"
      - "crates/graphrefly/Cargo.toml"
      - "Cargo.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

env:
  ASTRO_SITE_URL: "https://rs.graphrefly.dev"
  ASTRO_BASE_PATH: "/"
  RS_DOCS_CUSTOM_DOMAIN: "rs.graphrefly.dev"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rust-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Rust Starlight docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Enable Corepack (pnpm)
        working-directory: website
        run: |
          corepack enable
          corepack install

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-docs-site

      - name: Install docs website dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Build Rust docs site
        working-directory: website
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request'
    name: Deploy docs to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
