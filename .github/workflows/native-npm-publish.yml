# @graphrefly/native — npm publish (D203 native-ship; OIDC trusted
# publishing, NO NPM_TOKEN — D206).
#
# Separate from release.yml (which is crates.io / release-plz only —
# bindings crates are `publish = false` there, and napi-rs needs a Rust
# cross-compile matrix changesets can't do). This workflow cross-
# compiles the napi-rs `.node` for every configured target, publishes
# one per-platform npm package per target, then publishes the umbrella
# `@graphrefly/native` package whose optionalDependencies resolve the
# right binary at install time (canonical napi-rs layout).
#
# AUTH: npm OIDC trusted publishing (same model as release.yml in
# graphrefly-ts) — no long-lived NPM_TOKEN. Requires npm >= 11.5.1 +
# Node >= 22 + `id-token: write`. npm mints short-lived creds via the
# GitHub OIDC token and auto-attaches provenance.
#
# TRIGGER: push a tag matching `native-v*` (e.g. `native-v0.0.1`).
# Normally the tag is created automatically by native-auto-release.yml
# from Conventional Commits on merge to main (Option B, D206); a human
# may also push a `native-v*` tag manually. This workflow never runs on
# a normal push to main — only on the tag.
#
# ONE-TIME BOOTSTRAP (chicken-and-egg): OIDC trusted publishing requires
# each package to ALREADY EXIST on npm with a trusted publisher
# configured — you cannot configure a trusted publisher for a package
# that has never been published. So the FIRST publish of all 6 packages
# (umbrella `@graphrefly/native` + the 5 per-platform sub-packages) must
# be done once from a local machine using your interactive `npm login`
# (NOT a CI token):
#   1. Run  scripts/first-publish-native.sh   (cross-builds all 5
#      targets locally and publishes all 6 packages via your npm login).
#   2. For EACH of the 6 packages, on npmjs.com →
#      Package → Settings → Trusted Publisher → GitHub Actions:
#        org=graphrefly  repo=graphrefly-rs  workflow=native-npm-publish.yml
#   3. From then on, every `native-v*` tag publishes via OIDC here —
#      no token, ever.
#
# Tag → version: the workflow publishes whatever `version` is in
# crates/graphrefly-bindings-js/package.json. Bump that (via
# `napi version` or by hand) in the same commit you tag.

name: native-npm-publish

on:
  push:
    tags:
      - "native-v*"

permissions:
  contents: read
  id-token: write   # REQUIRED for npm OIDC trusted publishing

defaults:
  run:
    working-directory: crates/graphrefly-bindings-js

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            host: macos-latest
          - target: x86_64-unknown-linux-gnu
            host: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            host: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            host: windows-latest
          - target: aarch64-pc-windows-msvc
            host: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          targets: ${{ matrix.target }}
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # graphrefly-rs is a Rust repo with no root package.json, so
          # action-setup can't read a `packageManager` field the way
          # graphrefly-ts's release.yml does — pin explicitly. Keep in
          # sync with graphrefly-ts root package.json `packageManager`.
          version: 10.33.0
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build ${{ matrix.target }}
        # napi 3.x emits the per-target binary + the npm/<target>/
        # sub-package. `--features full` keeps structures + storage.
        run: pnpm exec napi build --platform --release --features full --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: crates/graphrefly-bindings-js/graphrefly-native.*.node
          if-no-files-found: error

  publish:
    name: publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC token for trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24   # >= 22 required for npm OIDC trusted publishing
          registry-url: "https://registry.npmjs.org"
      # OIDC trusted publishing needs npm >= 11.5.1. Node 24 ships a
      # recent npm, but pin-forward explicitly so a runner-image npm
      # downgrade can't silently break OIDC.
      - name: Ensure npm >= 11.5.1
        run: npm install -g npm@latest && npm --version
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # graphrefly-rs is a Rust repo with no root package.json, so
          # action-setup can't read a `packageManager` field the way
          # graphrefly-ts's release.yml does — pin explicitly. Keep in
          # sync with graphrefly-ts root package.json `packageManager`.
          version: 10.33.0
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: crates/graphrefly-bindings-js/artifacts
      - name: Move artifacts into npm sub-packages
        # `napi artifacts` distributes the downloaded .node files into
        # the per-target npm/<target>/ dirs that `napi prepublish`
        # publishes. napi 3.6.2 flag is --output-dir (not --dir).
        run: pnpm exec napi artifacts --output-dir artifacts
      # No NODE_AUTH_TOKEN: with `id-token: write` + npm >= 11.5.1 and a
      # trusted publisher configured for each package (one-time bootstrap
      # via scripts/first-publish-native.sh), npm authenticates via OIDC
      # and auto-attaches provenance. `napi prepublish` shells out to
      # `npm publish` per sub-package, so OIDC applies there too.
      - name: Publish per-platform packages (OIDC)
        # napi 3.6.2 has no --skip-gh-release; GitHub releases are
        # opt-in via --gh-release (default off), and `contents: read`
        # couldn't create one anyway. `-t npm` = --tag-style npm.
        run: pnpm exec napi prepublish -t npm
      - name: Publish umbrella @graphrefly/native (OIDC)
        # --ignore-scripts: the per-platform sub-packages are published
        # by the explicit `napi prepublish` step above; the umbrella
        # publish must not re-trigger napi prepublish (package.json no
        # longer has a prepublishOnly hook — this is belt-and-braces so
        # a future hook can't cause a double-publish recursion).
        run: npm publish --access public --provenance --ignore-scripts
