# release-plz: PR-based versioning + crates.io publish with Trusted
# Publishing (native OIDC, no API token).
#
# How this works (per release-plz docs):
#   1. On every push to main, two jobs run:
#      - release-plz-pr:      computes version bumps from conventional
#                              commits + opens a "release" PR that bumps
#                              versions + updates CHANGELOGs across the
#                              workspace. Sits open until you merge.
#      - release-plz-release: when the release PR is merged, this job
#                              publishes the bumped crates to crates.io
#                              in dependency order (release-plz handles
#                              this internally).
#   2. release-plz natively supports crates.io trusted publishing —
#      no `rust-lang/crates-io-auth-action` needed and no
#      CARGO_REGISTRY_TOKEN secret. Just set `id-token: write` and
#      release-plz handles the OIDC token exchange (per
#      https://release-plz.dev/docs/github/quickstart §2).
#
# Manual prerequisites (one-time):
#   1. First publish each crate manually to claim the name (already done
#      via `scripts/reserve-crate-names.sh`).
#   2. For each user-facing crate (graphrefly-core, -graph, -operators,
#      -storage, -structures), configure trusted publishing on
#      https://crates.io/crates/<name>/settings → Trusted Publishing →
#      Add → GitHub Actions:
#        - Repository owner:    graphrefly
#        - Repository name:     graphrefly-rs
#        - Workflow filename:   release.yml
#        - Environment (opt):   release
#   3. Install the same GitHub App used in graphrefly-ts on this repo, OR
#      enable Settings → Actions → General → Workflow permissions →
#      "Allow GitHub Actions to create and approve pull requests".
#      (Release-plz opens a version-bump PR, which the default
#      GITHUB_TOKEN can't do under the org's default policy.) The
#      App-token path below requires:
#        - Org var:    GRAPHREFLY_WRITE_CONTENT_APP_ID
#        - Org secret: GRAPHREFLY_WRITE_CONTENT_APP_PRIVATE_KEY
#        - App installed on graphrefly/graphrefly-rs with permissions:
#          Contents=write, Issues=write, Pull requests=write,
#          Metadata=read.
#      If you don't want the App on this repo, replace the
#      `actions/create-github-app-token@v3` step with a dummy and use
#      `${{ secrets.GITHUB_TOKEN }}` instead — but you must then enable
#      the org-level "Allow GitHub Actions to create PRs" toggle.
#   4. (Optional) GitHub Environment "release" with branch + reviewer
#      protection. The job below references it; remove the
#      `environment:` line if you don't want this.
#
# Bindings crates are excluded — they're marked `publish = false` in
# their Cargo.toml and release-plz respects that.

name: Release-plz

on:
  push:
    branches: [main]

# Don't trigger on the release-plz bot's own commits to avoid loops.
permissions:
  contents: read

jobs:
  # Publish unpublished crates when a release PR merges.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    environment: release   # remove this line if you don't use protected environments
    permissions:
      contents: write       # push tags + create GitHub releases
      pull-requests: read   # detect the release PR + its commits
      id-token: write       # REQUIRED for crates.io OIDC trusted publishing
    steps:
      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GRAPHREFLY_WRITE_CONTENT_APP_ID }}
          private-key: ${{ secrets.GRAPHREFLY_WRITE_CONTENT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # No CARGO_REGISTRY_TOKEN — release-plz uses OIDC trusted
          # publishing automatically when `id-token: write` is set.

  # Open / update a release PR with the next version bumps + changelogs.
  release-plz-pr:
    name: Release-plz PR
    # Belt-and-suspenders: skip when the head commit is the bot's own
    # "chore: release" merge commit. release-plz-release should have
    # already created per-package tags at this commit, so release-plz-pr
    # would no-op anyway — but this `if` prevents any edge case where the
    # tag isn't yet visible to release-plz, which would cause a NEW PR to
    # be opened (the infinite-loop bug).
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: release') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push to the release PR's branch
      pull-requests: write  # create + update the release PR
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GRAPHREFLY_WRITE_CONTENT_APP_ID }}
          private-key: ${{ secrets.GRAPHREFLY_WRITE_CONTENT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
