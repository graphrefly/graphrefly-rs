# Publishes graphrefly-* crates to crates.io via Trusted Publishing (OIDC).
#
# How this works (no long-lived API tokens needed):
#   1. Workflow triggered by a `v*` git tag push.
#   2. `rust-lang/crates-io-auth-action@v1` exchanges this workflow's GitHub
#      OIDC token for a short-lived (~30min) crates.io publish token.
#   3. `cargo publish` uses that token via `CARGO_REGISTRY_TOKEN` to publish
#      each user-facing crate in dependency order, with waits between tiers
#      so crates.io has time to index a freshly-published crate before its
#      dependents try to resolve it.
#
# Bindings crates (graphrefly-bindings-{js,py,wasm}) are marked
# `publish = false` in their Cargo.toml and are NOT published here — they
# build into npm/PyPI artifacts via separate workflows.
#
# Prerequisites (one-time, manual):
#   1. crates.io account exists and has manually published v0.0.1 (or later)
#      of each of the 5 crates listed in the publish steps below. (Trusted
#      publishing requires that the crate name already be claimed.)
#   2. For each crate, on crates.io: Settings → Trusted Publishing → Add →
#      GitHub Actions:
#         - Repository owner:    graphrefly
#         - Repository name:     graphrefly-rs
#         - Workflow filename:   release.yml
#         - Environment (opt):   release
#   3. (Optional but recommended) GitHub repo: Settings → Environments →
#      Create "release" with branch protection (e.g. only `main`) and
#      reviewer requirements. The `environment: release` line below picks
#      this up. Drop the `environment:` line if you don't want this.
#
# Release flow (per release):
#   1. Bump `[workspace.package].version` in `Cargo.toml`.
#   2. Commit, push to main.
#   3. `git tag vX.Y.Z && git push --tags`.
#   4. This workflow runs, publishes all 5 crates at the new version.

name: Release crates.io

on:
  push:
    tags: ['v*']
  workflow_dispatch:  # manual re-run from the Actions tab

permissions:
  contents: read

# Prevent two concurrent release runs from racing on crates.io index.
concurrency:
  group: release-crates-io
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: release  # remove this line if you don't use protected environments
    permissions:
      id-token: write  # REQUIRED for OIDC token exchange
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Match the workspace's rust-toolchain.toml pin.
          toolchain: "1.95"

      # Sanity check before talking to crates.io. CI on main already runs
      # the full suite, but a release tag can technically be pushed without
      # main being green — these two steps catch that.
      - name: Build (locked)
        run: cargo build --release --locked

      - name: Test (default-members; excludes binding crates by design)
        run: cargo test --locked

      # Exchange OIDC for short-lived crates.io token. The action sets
      # `steps.auth.outputs.token` for downstream steps.
      - name: Get crates.io OIDC token
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      # ---------- Tier 1: foundational, no in-workspace deps. ----------
      - name: Publish graphrefly-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked -p graphrefly-core

      # crates.io needs ~30–60s to index a freshly-published crate before
      # dependents can resolve it. Without this wait, Tier 2 publishes fail
      # with "no matching package named graphrefly-core found".
      - name: Wait for crates.io index (Tier 1 → 2)
        run: sleep 60

      # ---------- Tier 2: depends on -core only. ----------
      - name: Publish graphrefly-graph
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked -p graphrefly-graph

      - name: Publish graphrefly-operators
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked -p graphrefly-operators

      - name: Wait for crates.io index (Tier 2 → 3)
        run: sleep 45

      # ---------- Tier 3: depends on -core + -graph. ----------
      - name: Publish graphrefly-storage
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked -p graphrefly-storage

      - name: Publish graphrefly-structures
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked -p graphrefly-structures

      - name: Done
        run: |
          echo "Published 5 crates at version $(grep -E '^version' Cargo.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')"
          echo "Verify at: https://crates.io/users/<your-username>"
