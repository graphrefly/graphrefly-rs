# =============================================================================
# graphrefly-rs — clean-slate workspace
#
# Authority: ~/src/graphrefly. The protocol spec, decisions
# (D#), formal model, and conformance scenarios live there — that repo wins on
# any disagreement. See crates/graphrefly/CLEAN-SLATE.md for the CSP-5 scope map.
#
# The workspace contains the Rust package. Python owns its independent kernel.
# =============================================================================

[workspace]
resolver = "2"
members  = [
    "crates/graphrefly",
]
[workspace.package]
edition      = "2021"
rust-version = "1.95"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/graphrefly/graphrefly-rs"
homepage     = "https://graphrefly.dev"
authors      = ["David Chen<clfhhc@gmail.com>"]

# ---------------------------------------------------------------------------
# Shared dependencies — a node function runs synchronously (R-invocation@2) and
# a graph is single-thread (D22, R-graph-domain@3), so the substrate carries NO
# concurrency primitives. The local async driver lands behind a `tokio` feature.
# Additional package
# surfaces are reintroduced in the clean-slate crate only when re-derived from
# the language-neutral authority.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# Errors / logging
thiserror   = { version = "1" }
tracing     = { version = "0.1" }
serde       = { version = "1", features = ["derive"] }
serde_json  = { version = "1" }
sha2        = { version = "0.10" }

# Small-collection primitives
smallvec    = { version = "1.13", features = ["union", "const_new"] }
indexmap    = { version = "2.6" }

# Compile-time invariant assertions — lock the substrate to !Send + !Sync so a
# future field change can't silently widen the bounds (D22 single-thread).
static_assertions = { version = "1.1" }

# Async runtime — the local async driver's timer substrate, feature-gated.
# Declared here so the version is pinned now.
tokio       = { version = "1", default-features = false }

# Test-only
proptest    = { version = "1" }
criterion   = { version = "0.5" }

# ---------------------------------------------------------------------------
# Build profiles
# ---------------------------------------------------------------------------
[profile.release]
lto           = true
codegen-units = 1
strip         = "symbols"

# Mild optimization for dependencies in dev so test runs are fast; our own crate
# stays opt-level=0 for fast incremental compiles.
[profile.dev.package."*"]
opt-level = 1

# Profiling profile: release-optimized but keeps debug symbols + frame pointers
# so samply / Instruments produce readable backtraces. F-PERF discipline.
[profile.profiling]
inherits      = "release"
debug         = true
strip         = "none"
lto           = false
codegen-units = 1
