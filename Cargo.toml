# =============================================================================
# graphrefly-rs — clean-slate workspace
#
# Authority: ~/src/graphrefly (branch clean-slate). The protocol spec, decisions
# (D#), formal model, and conformance scenarios live there — that repo wins on
# any disagreement. See crates/graphrefly/CLEAN-SLATE.md for the CSP-5 scope map.
#
# D32: each language is ONE self-contained package (no cross-language peer-deps).
# The Rust clean-slate package is the single crate `graphrefly`. The previous
# port-model crates (graphrefly-core / -graph / -operators / -storage /
# -structures + the 3 bindings) are FROZEN as read-only reference (D41 analogue)
# and `exclude`d below — they no longer build against this workspace and are
# deleted once `graphrefly` reaches intent-parity.
# =============================================================================

[workspace]
resolver = "2"
members  = ["crates/graphrefly"]
exclude  = [
    # Frozen port-model reference (D41 analogue) — read-only, retired by the
    # clean-slate pivot. Source-as-reference during re-derivation; delete at
    # intent-parity. These intentionally no longer build in this workspace.
    "crates/graphrefly-core",
    "crates/graphrefly-graph",
    "crates/graphrefly-operators",
    "crates/graphrefly-storage",
    "crates/graphrefly-structures",
    "crates/graphrefly-bindings-js",
    "crates/graphrefly-bindings-py",
    "crates/graphrefly-bindings-wasm",
]

[workspace.package]
edition      = "2021"
rust-version = "1.95"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/graphrefly/graphrefly-rs"
homepage     = "https://graphrefly.dev"
authors      = ["David Chen<clfhhc@gmail.com>"]

# ---------------------------------------------------------------------------
# Shared dependencies — the clean-slate substrate is sync-core (F-SYNC-CORE)
# and single-thread (D22), so it carries NO concurrency primitives. The async
# pool (LocalAsync, D20) lands later behind a `tokio` feature. The old deep
# storage/CID/serde stack belongs to the frozen upper-layer crates and is
# re-introduced per-phase if/when those subsystems are re-derived (CSP-2.8-rs).
# ---------------------------------------------------------------------------
[workspace.dependencies]
# Errors / logging
thiserror   = { version = "1" }
tracing     = { version = "0.1" }

# Small-collection primitives
smallvec    = { version = "1.13", features = ["union", "const_new"] }
indexmap    = { version = "2.6" }

# Compile-time invariant assertions — lock the substrate to !Send + !Sync so a
# future field change can't silently widen the bounds (D22 single-thread).
static_assertions = { version = "1.1" }

# Async runtime — LocalAsync pool timer substrate, feature-gated (added in CSP-5
# when the async pool arm lands). Declared here so the version is pinned now.
tokio       = { version = "1", default-features = false }

# Test-only
proptest    = { version = "1" }
criterion   = { version = "0.5" }

# ---------------------------------------------------------------------------
# Build profiles
# ---------------------------------------------------------------------------
[profile.release]
lto           = true
codegen-units = 1
strip         = "symbols"

# Mild optimization for dependencies in dev so test runs are fast; our own crate
# stays opt-level=0 for fast incremental compiles.
[profile.dev.package."*"]
opt-level = 1

# Profiling profile: release-optimized but keeps debug symbols + frame pointers
# so samply / Instruments produce readable backtraces. F-PERF discipline.
[profile.profiling]
inherits      = "release"
debug         = true
strip         = "none"
lto           = false
codegen-units = 1
