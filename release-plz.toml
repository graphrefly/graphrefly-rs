# release-plz workspace config. See https://release-plz.dev/docs/config
#
# By default release-plz operates on every workspace member. The Python binding
# crate is marked `publish = false` in its Cargo.toml. release-plz requires this
# config to AGREE with each Cargo.toml's publish setting — if Cargo.toml says
# publish=false, the release-plz config must also say publish=false (the default
# is publish=true). Without this match release-plz fails with:
#   "Package `X` has `publish = false` ... in Cargo.toml, but it has
#    `publish = true` in the release-plz configuration."
#
# We additionally set `release = false` to skip the GitHub release entry
# (no point cutting a release for a crate we don't publish).

[workspace]
# Conventional Commits → SemVer bumps. Default; explicit for clarity.
semver_check        = true
# Generate CHANGELOG.md per crate. Default true; explicit for clarity.
changelog_update    = true
# Per-package tag template. Keep package-scoped tags so future publishable
# workspace members can version independently without tag collisions.
git_tag_name        = "{{ package }}-v{{ version }}"

# Per-crate override for the Python binding foundation: skip cargo publish AND
# skip the GitHub release. It builds into Python artifacts via maturin, not
# crates.io.
[[package]]
name    = "graphrefly-bindings-py"
publish = false
release = false
