# cargo-deny config — supply-chain hygiene equivalent of `npm audit` but
# stronger (per-license enforcement, version-unification warnings, registry
# allowlist). Run `cargo deny check` in CI.
#
# Setup: `cargo install cargo-deny` (once globally on the dev machine).

[graph]
all-features = true

# ---------------------------------------------------------------------------
# Licenses — what we accept in the dep tree.
# ---------------------------------------------------------------------------
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# ---------------------------------------------------------------------------
# Advisories — RustSec advisory database.
# ---------------------------------------------------------------------------
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked  = "deny"
ignore  = []

# ---------------------------------------------------------------------------
# Bans — version unification and crate exclusions.
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"   # warn but don't fail on duplicate versions in tree
deny              = []
skip              = []
skip-tree         = []

# ---------------------------------------------------------------------------
# Sources — registry allowlist.
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "warn"
unknown-git      = "warn"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = []
